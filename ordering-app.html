<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ร้านอาหาร · ระบบสั่งอาหาร</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #F7F3EC;
      --surface: #ffffff;
      --surface-2: #FBF8F1;
      --ink: #20221E;
      --muted: #7C7869;
      --line: #E7E0D2;
      --green: #2C6E49;
      --green-d: #1F5236;
      --rust: #CB4B16;
      --rust-d: #A63C10;
      --gold: #E9B949;
      --gold-soft: #FBEFCB;
      --red: #B3261E;
      --blue: #2F5D8A;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(32, 34, 30, .06), 0 8px 24px -12px rgba(32, 34, 30, .18);
      --shadow-lg: 0 20px 50px -20px rgba(32, 34, 30, .35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-variant-numeric: tabular-nums
    }

    h1,
    h2,
    h3,
    .disp {
      font-family: 'Kanit', sans-serif;
      font-weight: 600;
      letter-spacing: .2px;
      margin: 0
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 15px
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px
    }

    ::-webkit-scrollbar-thumb {
      background: #D9D0BE;
      border-radius: 9px
    }

    img {
      max-width: 100%
    }

    /* ---------- layout ---------- */
    .app {
      max-width: 980px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative
    }

    .screen {
      display: none;
      animation: fade .35s ease
    }

    .screen.active {
      display: block
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 15px;
      transition: transform .08s, filter .15s, background .15s;
      line-height: 1
    }

    .btn:active {
      transform: translateY(1px)
    }

    .btn-primary {
      background: var(--rust);
      color: #fff
    }

    .btn-primary:hover {
      filter: brightness(1.05)
    }

    .btn-green {
      background: var(--green);
      color: #fff
    }

    .btn-dark {
      background: var(--ink);
      color: #fff
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--line)
    }

    .btn-ghost:hover {
      border-color: #cfc6b3
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 13.5px;
      border-radius: 9px
    }

    .btn-block {
      width: 100%
    }

    .btn:disabled {
      opacity: .45;
      pointer-events: none
    }

    /* ---------- generic ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--rust);
      font-weight: 600;
      font-family: 'Kanit'
    }

    label.f {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px
    }

    .inp {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      transition: border .15s
    }

    .inp:focus {
      outline: none;
      border-color: var(--green);
      background: #fff
    }

    .row {
      display: flex;
      gap: 12px
    }

    .grow {
      flex: 1
    }

    .muted {
      color: var(--muted)
    }

    .center {
      text-align: center
    }

    .hidden {
      display: none !important
    }

    /* ---------- HERO / HOME ---------- */
    .home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px;
      background:
        radial-gradient(120% 80% at 80% -10%, #FCEFD0 0%, transparent 55%),
        radial-gradient(90% 70% at -10% 110%, #E4EFE4 0%, transparent 50%),
        var(--bg);
    }

    .brandmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 34px
    }

    .brandmark .dot {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--ink);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-family: 'Kanit';
      font-weight: 700;
      font-size: 22px;
      box-shadow: var(--shadow)
    }

    .brandmark b {
      font-family: 'Kanit';
      font-size: 19px;
      font-weight: 600
    }

    .home h1 {
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.08;
      font-weight: 700
    }

    .home h1 em {
      font-style: normal;
      color: var(--rust)
    }

    .home .lead {
      color: var(--muted);
      font-size: 16px;
      margin: 14px 0 30px;
      max-width: 34ch
    }

    .choices {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr 1fr;
      max-width: 560px
    }

    @media(max-width:560px) {
      .choices {
        grid-template-columns: 1fr
      }
    }

    .choice {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      text-align: left;
      box-shadow: var(--shadow);
      transition: transform .12s, box-shadow .2s;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .choice:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg)
    }

    .choice .ic {
      font-size: 26px;
      margin-bottom: 4px
    }

    .choice b {
      font-family: 'Kanit';
      font-size: 17px
    }

    .choice span {
      color: var(--muted);
      font-size: 13.5px
    }

    .choice.staff {
      background: var(--ink);
      color: #F7F3EC
    }

    .choice.staff span {
      color: #B9B3A3
    }

    /* ---------- top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 243, 236, .9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px
    }

    .topbar .t-title {
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 16px;
      line-height: 1.1
    }

    .topbar .t-sub {
      font-size: 12px;
      color: var(--muted)
    }

    .tag-table {
      margin-left: auto;
      background: var(--green);
      color: #fff;
      font-family: 'Kanit';
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 14px
    }

    /* ---------- customer menu ---------- */
    .cust-wrap {
      padding: 14px 16px 130px
    }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
      position: sticky;
      top: 57px;
      z-index: 20;
      background: linear-gradient(var(--bg) 70%, transparent)
    }

    .cats::-webkit-scrollbar {
      display: none
    }

    .cat {
      white-space: nowrap;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      font-weight: 600;
      font-size: 14px;
      color: var(--muted);
      transition: all .15s
    }

    .cat.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .menu-sec {
      margin: 16px 0 6px
    }

    .menu-sec h2 {
      font-size: 15px;
      color: var(--rust);
      letter-spacing: 1px;
      font-family: 'Kanit'
    }

    .dish {
      display: flex;
      gap: 12px;
      padding: 14px;
      align-items: center;
      margin: 10px 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .dish.out {
      opacity: .55
    }

    .dish .info {
      flex: 1;
      min-width: 0
    }

    .dish .nm {
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 15.5px
    }

    .dish .ds {
      color: var(--muted);
      font-size: 12.5px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical
    }

    .dish .pr {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      font-size: 15px;
      margin-top: 6px
    }

    .dish .thumb {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: var(--gold-soft)
    }

    .add-ctrl {
      flex-shrink: 0
    }

    .qbtn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1.5px solid var(--line);
      font-size: 19px;
      font-weight: 600;
      display: grid;
      place-items: center;
      color: var(--ink)
    }

    .qbox {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .qbox .n {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      min-width: 16px;
      text-align: center
    }

    .add-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--rust);
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      display: grid;
      place-items: center;
      line-height: 1
    }

    .out-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted)
    }

    /* cart bar */
    .cartbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom))
    }

    .cartbar-inner {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 12px 14px 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-lg)
    }

    .cartbar .ct-count {
      background: var(--gold);
      color: var(--ink);
      border-radius: 9px;
      padding: 3px 9px;
      font-family: 'Kanit';
      font-weight: 700;
      font-size: 14px
    }

    .cartbar .ct-total {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      font-size: 17px;
      margin-left: auto
    }

    /* ---------- modal / sheet ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(32, 34, 30, .5);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center
    }

    .overlay.active {
      display: flex;
      animation: fade .2s
    }

    .sheet {
      background: var(--bg);
      width: 100%;
      max-width: 560px;
      border-radius: 22px 22px 0 0;
      max-height: 90vh;
      overflow: auto;
      animation: slideup .3s cubic-bezier(.2, .9, .3, 1);
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom))
    }

    @keyframes slideup {
      from {
        transform: translateY(100%)
      }

      to {
        transform: none
      }
    }

    .sheet-grab {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: #D6CDBB;
      margin: 0 auto 14px
    }

    .modal-c {
      background: var(--bg);
      width: 100%;
      max-width: 480px;
      margin: auto 16px;
      border-radius: 20px;
      padding: 22px;
      animation: slideup .25s
    }

    .overlay.mid {
      align-items: center
    }

    /* cart lines */
    .cline {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line)
    }

    .cline .cn {
      flex: 1
    }

    .cline .cn b {
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 15px
    }

    .cline .cp {
      font-family: 'IBM Plex Mono';
      font-weight: 600
    }

    /* ---------- ticket (order docket) ---------- */
    .ticket {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative
    }

    .ticket::before,
    .ticket::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: var(--bg);
      border-radius: 50%;
      top: 52px
    }

    .ticket::before {
      left: -8px
    }

    .ticket::after {
      right: -8px
    }

    .ticket-top {
      padding: 12px 14px;
      border-bottom: 2px dashed var(--line);
      display: flex;
      align-items: center;
      gap: 10px
    }

    .ticket-top .tk-no {
      font-family: 'IBM Plex Mono';
      font-weight: 700;
      font-size: 15px
    }

    .ticket-top .tk-tb {
      font-family: 'Kanit';
      font-weight: 700;
      background: var(--ink);
      color: #fff;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 13px
    }

    .ticket-body {
      padding: 10px 14px
    }

    .ti {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      font-size: 14px
    }

    .ti .q {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      color: var(--rust);
      min-width: 26px
    }

    .ticket-foot {
      padding: 10px 14px;
      border-top: 1px dashed var(--line);
      display: flex;
      align-items: center;
      gap: 8px
    }

    /* status pills */
    .st-new {
      background: #FDECC8;
      color: #8a5a00
    }

    .st-cooking {
      background: #DCE9F7;
      color: #2F5D8A
    }

    .st-served {
      background: #DFF0E3;
      color: #2C6E49
    }

    .st-paid {
      background: #E9E5DB;
      color: #6b6656
    }

    .st-cancelled {
      background: #F6DAD7;
      color: #9a2c22
    }

    /* ---------- staff shell ---------- */
    .staff-head {
      background: var(--ink);
      color: #F7F3EC;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px
    }

    .staff-head .sh-dot {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--gold);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-family: 'Kanit';
      font-weight: 700;
      font-size: 18px
    }

    .staff-head b {
      font-family: 'Kanit';
      font-size: 16px;
      display: block;
      line-height: 1.1
    }

    .staff-head small {
      color: #B9B3A3;
      font-size: 12px
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 10px 12px;
      background: #26281f;
      scrollbar-width: none
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      white-space: nowrap;
      padding: 9px 15px;
      border-radius: 9px;
      color: #C9C3B2;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Kanit'
    }

    .tab.active {
      background: var(--bg);
      color: var(--ink)
    }

    .tab .badge {
      background: var(--rust);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      padding: 1px 6px;
      margin-left: 5px;
      font-family: 'IBM Plex Mono'
    }

    .staff-body {
      padding: 16px 16px 80px
    }

    .sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 14px
    }

    .sec-head h2 {
      font-size: 19px
    }

    .sec-head .btn {
      margin-left: auto
    }

    .grid2 {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr))
    }

    /* orders filter */
    .ofilter {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none
    }

    .ofilter::-webkit-scrollbar {
      display: none
    }

    .chip {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      font-weight: 600;
      font-size: 13.5px;
      color: var(--muted)
    }

    .chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    /* menu editor rows */
    .mrow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow)
    }

    .mrow .mn {
      flex: 1;
      min-width: 0
    }

    .mrow .mn b {
      font-family: 'Kanit';
      font-weight: 600
    }

    .mrow .mn small {
      color: var(--muted)
    }

    .switch {
      width: 44px;
      height: 26px;
      border-radius: 999px;
      background: #D8D0BE;
      position: relative;
      transition: background .18s;
      flex-shrink: 0
    }

    .switch.on {
      background: var(--green)
    }

    .switch i {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: left .18s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25)
    }

    .switch.on i {
      left: 21px
    }

    /* QR / tables */
    .qr-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow)
    }

    .qr-card .qrimg {
      width: 150px;
      height: 150px;
      margin: 8px auto;
      display: grid;
      place-items: center;
      background: #fff;
      border-radius: 10px
    }

    .qr-card b {
      font-family: 'Kanit';
      font-size: 16px
    }

    .report-tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .report-tile .big {
      font-family: 'Kanit';
      font-weight: 700;
      font-size: 30px
    }

    .report-tile small {
      color: var(--muted);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: .5px
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted)
    }

    .empty .ic {
      font-size: 44px;
      margin-bottom: 10px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      z-index: 200;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px)
    }

    .note {
      background: var(--gold-soft);
      border: 1px solid #ECDBA6;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: #7a5c12
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 16px 0
    }

    .link {
      color: var(--green);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px
    }
  </style>
</head>

<body>
  <div class="app" id="app"></div>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       ระบบสั่งอาหารร้านอาหาร — ทำงานทั้งฝั่งลูกค้า (สแกน QR) และพนักงาน
       เก็บข้อมูลถาวรผ่าน window.storage (แชร์ทุกเครื่องที่เปิดแอปเดียวกัน)
       ========================================================= */

    /* ---------- storage layer (+ fallback) ---------- */
    const _mem = new Map();
    const _hasStore = (typeof window !== 'undefined' && window.storage);
    async function sGet(key, shared = true) {
      if (_hasStore) {
        try { const r = await window.storage.get(key, shared); return r ? r.value : null; }
        catch (e) { return _mem.get(key + shared) ?? null; }
      }
      return _mem.get(key + shared) ?? null;
    }
    async function sSet(key, val, shared = true) {
      if (_hasStore) { try { await window.storage.set(key, val, shared); return; } catch (e) { } }
      _mem.set(key + shared, val);
    }
    async function dbGet(k, def, shared = true) { const v = await sGet(k, shared); if (v == null) return def; try { return JSON.parse(v) } catch (e) { return def } }
    async function dbSet(k, v, shared = true) { await sSet(k, JSON.stringify(v), shared); }

    /* ---------- state ---------- */
    let DB = { menu: [], orders: [], staff: [], settings: {} };
    let S = { view: 'home', table: null, cart: [], cat: null, staffUser: null, tab: 'orders', ofilter: 'active', newOrderTable: null, custStatus: false };
    let pollTimer = null;

    const STATUSES = [
      { key: 'new', label: 'ใหม่', next: 'cooking' },
      { key: 'cooking', label: 'กำลังทำ', next: 'served' },
      { key: 'served', label: 'เสิร์ฟแล้ว', next: 'paid' },
      { key: 'paid', label: 'ชำระแล้ว', next: null },
    ];
    const stLabel = k => (STATUSES.find(s => s.key === k) || { label: k }).label;
    const money = n => Number(n || 0).toLocaleString('th-TH');
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    /* ---------- defaults ---------- */
    const DEFAULT_MENU = [
      { cat: 'แนะนำ', name: 'ผัดไทยกุ้งสด', price: 90, emoji: '🍤', desc: 'เส้นจันท์ผัดซอสสูตรร้าน' },
      { cat: 'แนะนำ', name: 'ต้มยำกุ้งน้ำข้น', price: 150, emoji: '🍲', desc: 'เผ็ดร้อน กุ้งแม่น้ำ' },
      { cat: 'แนะนำ', name: 'ข้าวผัดปู', price: 120, emoji: '🦀', desc: 'เนื้อปูก้อนแน่น' },
      { cat: 'ต้ม & ยำ', name: 'ยำวุ้นเส้นทะเล', price: 110, emoji: '🥗', desc: 'รสจัดจ้าน' },
      { cat: 'ต้ม & ยำ', name: 'ต้มข่าไก่', price: 90, emoji: '🥥', desc: 'กะทิสด' },
      { cat: 'ผัด', name: 'กะเพราหมูสับไข่ดาว', price: 70, emoji: '🍳', desc: 'เผ็ดร้อนใบกะเพราหอม' },
      { cat: 'ผัด', name: 'ผัดคะน้าหมูกรอบ', price: 80, emoji: '🥬', desc: '' },
      { cat: 'ผัด', name: 'ผัดซีอิ๊วเส้นใหญ่', price: 70, emoji: '🍜', desc: '' },
      { cat: 'ข้าว', name: 'ข้าวสวย', price: 15, emoji: '🍚', desc: 'หุงร้อนใหม่' },
      { cat: 'ข้าว', name: 'ข้าวเหนียว', price: 15, emoji: '🍙', desc: '' },
      { cat: 'ของหวาน', name: 'ข้าวเหนียวมะม่วง', price: 80, emoji: '🥭', desc: 'ตามฤดูกาล' },
      { cat: 'ของหวาน', name: 'บัวลอยไข่หวาน', price: 45, emoji: '🍮', desc: '' },
      { cat: 'เครื่องดื่ม', name: 'ชาไทยเย็น', price: 40, emoji: '🧋', desc: '' },
      { cat: 'เครื่องดื่ม', name: 'น้ำเปล่า', price: 15, emoji: '💧', desc: '' },
      { cat: 'เครื่องดื่ม', name: 'โซดามะนาว', price: 45, emoji: '🍹', desc: '' },
    ].map(m => ({ id: uid(), available: true, ...m }));

    async function seed() {
      DB.settings = await dbGet('settings', null);
      if (!DB.settings) { DB.settings = { name: 'ครัวคุณแม่', tables: 12, baseUrl: '' }; await dbSet('settings', DB.settings); }
      DB.menu = await dbGet('menu', null);
      if (!DB.menu) { DB.menu = DEFAULT_MENU; await dbSet('menu', DB.menu); }
      DB.staff = await dbGet('staff', null);
      if (!DB.staff) { DB.staff = [{ user: 'admin', pass: '1234', name: 'ผู้จัดการ' }]; await dbSet('staff', DB.staff); }
      DB.orders = await dbGet('orders', []);
    }
    async function reloadOrders() { DB.orders = await dbGet('orders', []); }
    async function saveOrders() { await dbSet('orders', DB.orders); }
    async function saveMenu() { await dbSet('menu', DB.menu); }
    async function saveSettings() { await dbSet('settings', DB.settings); }

    /* ---------- helpers ---------- */
    const $ = s => document.querySelector(s);
    const app = () => $('#app');
    const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900); }
    function openSheet(html) { const o = $('#overlay'); o.className = 'overlay active'; o.innerHTML = `<div class="sheet"><div class="sheet-grab"></div>${html}</div>`; o.onclick = e => { if (e.target === o) closeOverlay() }; }
    function openModal(html) { const o = $('#overlay'); o.className = 'overlay active mid'; o.innerHTML = `<div class="modal-c">${html}</div>`; o.onclick = e => { if (e.target === o) closeOverlay() }; }
    function closeOverlay() { const o = $('#overlay'); o.className = 'overlay'; o.innerHTML = ''; }

    /* ---------- polling for live updates ---------- */
    function startPoll() {
      stopPoll(); pollTimer = setInterval(async () => {
        const before = JSON.stringify(DB.orders); await reloadOrders();
        if (JSON.stringify(DB.orders) !== before) {
          if (S.view === 'staff' && S.tab === 'orders') renderOrders();
          if (S.view === 'customer' && S.custStatus) renderCustomerStatus();
        }
      }, 4000);
    }
    function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    /* =========================================================
       ROUTER
       ========================================================= */
    async function boot() {
      await seed();
      const params = new URLSearchParams(location.search);
      const t = params.get('table');
      // auto login (remember me)
      const session = await dbGet('session', null, false);
      if (session && DB.staff.find(s => s.user === session.user)) { S.staffUser = session.user; }

      if (t) { S.table = t; S.view = 'customer'; S.cat = DB.menu[0]?.cat; render(); }
      else if (S.staffUser) { S.view = 'staff'; render(); }
      else { S.view = 'home'; render(); }
    }

    function render() {
      stopPoll();
      const v = S.view;
      if (v === 'home') return renderHome();
      if (v === 'customer') return S.custStatus ? renderCustomerStatus() : renderCustomer();
      if (v === 'staff-login') return renderLogin();
      if (v === 'staff') return renderStaff();
    }

    /* =========================================================
       HOME
       ========================================================= */
    function renderHome() {
      app().innerHTML = `
  <div class="screen active home">
    <div class="brandmark"><span class="dot">ค</span><b>${esc(DB.settings.name)}</b></div>
    <div class="eyebrow">ระบบสั่งอาหาร</div>
    <h1>สั่งอาหาร<br>ง่าย ๆ <em>ที่โต๊ะ</em></h1>
    <p class="lead">ลูกค้าสแกน QR ที่โต๊ะแล้วสั่งได้เลย ไม่ต้องล็อกอิน · พนักงานเข้าระบบเพื่อรับออเดอร์และดูรายงาน</p>
    <div class="choices">
      <button class="choice" onclick="pickTablePrompt()">
        <span class="ic">🍽️</span><b>ฉันเป็นลูกค้า</b>
        <span>เลือกโต๊ะเพื่อดูเมนู (ปกติสแกน QR ที่โต๊ะ)</span>
      </button>
      <button class="choice staff" onclick="S.view='staff-login';render()">
        <span class="ic">👩‍🍳</span><b>พนักงานเข้าสู่ระบบ</b>
        <span>รับออเดอร์ · จัดการเมนู · Excel</span>
      </button>
    </div>
  </div>`;
    }
    function pickTablePrompt() {
      const n = DB.settings.tables || 12;
      let opts = ''; for (let i = 1; i <= n; i++) opts += `<button class="cat" style="min-width:56px;justify-content:center" onclick="enterTable('${i}')">${i}</button>`;
      openSheet(`<h2 style="font-size:18px">เลือกหมายเลขโต๊ะ</h2>
    <p class="muted" style="margin:6px 0 14px;font-size:13.5px">ในการใช้งานจริง ลูกค้าจะสแกน QR ของแต่ละโต๊ะ (พนักงานสร้าง QR ได้ในเมนู “โต๊ะ & QR”)</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${opts}</div>`);
    }
    function enterTable(n) { S.table = n; S.view = 'customer'; S.custStatus = false; S.cat = DB.menu[0]?.cat; closeOverlay(); render(); }

    /* =========================================================
       CUSTOMER — menu & cart
       ========================================================= */
    function cats() { return [...new Set(DB.menu.map(m => m.cat))]; }
    function cartCount() { return S.cart.reduce((a, c) => a + c.qty, 0); }
    function cartTotal() { return S.cart.reduce((a, c) => a + c.qty * c.price, 0); }
    function inCart(id) { return S.cart.find(c => c.id === id); }

    function renderCustomer() {
      if (!S.cat || !cats().includes(S.cat)) S.cat = cats()[0];
      const list = DB.menu.filter(m => m.cat === S.cat);
      app().innerHTML = `
  <div class="screen active">
    <div class="topbar">
      <div><div class="t-title">${esc(DB.settings.name)}</div><div class="t-sub">เมนูอาหาร · สั่งได้เลย</div></div>
      <div class="tag-table">โต๊ะ ${esc(S.table)}</div>
    </div>
    <div class="cust-wrap">
      <div class="cats">${cats().map(c => `<button class="cat ${c === S.cat ? 'active' : ''}" onclick="S.cat='${esc(c)}';renderCustomer()">${esc(c)}</button>`).join('')}</div>
      <div class="menu-sec"><h2>${esc(S.cat)}</h2></div>
      ${list.map(dishRow).join('') || `<div class="empty"><div class="ic">🍽️</div>ยังไม่มีเมนูในหมวดนี้</div>`}
      <div style="text-align:center;margin-top:26px">
        <button class="link" style="background:none" onclick="viewCustStatus()">ดูสถานะออเดอร์ของโต๊ะนี้ →</button>
      </div>
    </div>
    ${cartBar()}
  </div>`;
    }
    function dishRow(m) {
      const c = inCart(m.id);
      const ctrl = !m.available
        ? `<span class="out-tag">หมด</span>`
        : c ? `<div class="qbox"><button class="qbtn" onclick="chg('${m.id}',-1)">−</button><span class="n">${c.qty}</span><button class="qbtn" onclick="chg('${m.id}',1)">+</button></div>`
          : `<button class="add-btn" onclick="chg('${m.id}',1)">+</button>`;
      return `<div class="dish ${m.available ? '' : 'out'}">
    <div class="thumb">${m.emoji || '🍴'}</div>
    <div class="info"><div class="nm">${esc(m.name)}</div>${m.desc ? `<div class="ds">${esc(m.desc)}</div>` : ''}<div class="pr">฿${money(m.price)}</div></div>
    <div class="add-ctrl">${ctrl}</div>
  </div>`;
    }
    function chg(id, d) {
      const m = DB.menu.find(x => x.id === id); if (!m) return;
      let c = inCart(id);
      if (!c) { if (d > 0) { S.cart.push({ id, name: m.name, price: m.price, qty: 1 }); } }
      else { c.qty += d; if (c.qty <= 0) S.cart = S.cart.filter(x => x.id !== id); }
      if (S.view === 'customer' && !S.custStatus) renderCustomer();
      else if (S.newOrderTable != null) renderNewOrder();
    }
    function cartBar() {
      if (!cartCount()) return '';
      return `<div class="cartbar"><div class="cartbar-inner" onclick="openCart()">
    <span class="ct-count">${cartCount()}</span><span>ดูตะกร้า</span>
    <span class="ct-total">฿${money(cartTotal())}</span></div></div>`;
    }
    function openCart() {
      if (!S.cart.length) { toast('ตะกร้าว่างอยู่'); return; }
      const lines = S.cart.map(c => `<div class="cline">
      <div class="qbox"><button class="qbtn" onclick="chg('${c.id}',-1);refreshCart()">−</button><span class="n">${c.qty}</span><button class="qbtn" onclick="chg('${c.id}',1);refreshCart()">+</button></div>
      <div class="cn"><b>${esc(c.name)}</b><br><span class="muted mono">฿${money(c.price)}</span></div>
      <div class="cp">฿${money(c.qty * c.price)}</div>
    </div>`).join('');
      openSheet(`<h2 style="font-size:19px">ตะกร้า · โต๊ะ ${esc(S.table)}</h2>
    <div id="cartLines">${lines}</div>
    <div style="display:flex;align-items:center;margin:16px 0"><b style="font-family:'Kanit';font-size:16px">รวมทั้งหมด</b>
      <span class="mono" style="margin-left:auto;font-size:20px;font-weight:600">฿${money(cartTotal())}</span></div>
    <label class="f">หมายเหตุถึงครัว (ถ้ามี)</label>
    <textarea class="inp" id="ordNote" rows="2" placeholder="เช่น ไม่เผ็ด, ไม่ใส่ผัก"></textarea>
    <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="placeOrder()">ยืนยันสั่งอาหาร · ฿${money(cartTotal())}</button>`);
    }
    function refreshCart() {
      if (!S.cart.length) { closeOverlay(); if (S.view === 'customer' && !S.custStatus) renderCustomer(); return; }
      const el = $('#cartLines'); if (!el) { return; }
      openCart();
    }
    async function placeOrder() {
      if (!S.cart.length) return;
      const note = ($('#ordNote')?.value || '').trim();
      const order = {
        id: uid(), no: orderNo(), table: S.table, items: S.cart.map(c => ({ name: c.name, price: c.price, qty: c.qty })),
        total: cartTotal(), note, status: 'new', createdAt: Date.now(), by: 'ลูกค้า'
      };
      await reloadOrders(); DB.orders.push(order); await saveOrders();
      S.cart = []; closeOverlay(); toast('ส่งออเดอร์ไปที่ครัวแล้ว ✓');
      S.custStatus = true; renderCustomerStatus();
    }
    function orderNo() { const d = new Date(); return '#' + String(DB.orders.length + 1).padStart(3, '0'); }

    async function viewCustStatus() { await reloadOrders(); S.custStatus = true; renderCustomerStatus(); }
    function renderCustomerStatus() {
      const mine = DB.orders.filter(o => String(o.table) === String(S.table)).sort((a, b) => b.createdAt - a.createdAt);
      app().innerHTML = `
  <div class="screen active">
    <div class="topbar">
      <button class="btn btn-sm btn-ghost" onclick="S.custStatus=false;renderCustomer()">← เมนู</button>
      <div><div class="t-title">สถานะออเดอร์</div><div class="t-sub">อัปเดตอัตโนมัติ</div></div>
      <div class="tag-table">โต๊ะ ${esc(S.table)}</div>
    </div>
    <div class="cust-wrap" style="padding-bottom:40px">
      ${mine.length ? mine.map(o => custTicket(o)).join('') : `<div class="empty"><div class="ic">🧾</div>ยังไม่มีออเดอร์ของโต๊ะนี้<br><button class="link" style="background:none;margin-top:10px" onclick="S.custStatus=false;renderCustomer()">กลับไปสั่งอาหาร</button></div>`}
    </div>
  </div>`;
      startPoll();
    }
    function custTicket(o) {
      return `<div class="ticket" style="margin-bottom:14px">
    <div class="ticket-top"><span class="tk-no mono">${esc(o.no || '')}</span>
      <span class="pill st-${o.status}" style="margin-left:auto">${stLabel(o.status)}</span></div>
    <div class="ticket-body">${o.items.map(i => `<div class="ti"><span class="q">${i.qty}×</span><span>${esc(i.name)}</span></div>`).join('')}
      ${o.note ? `<div class="ti muted" style="margin-top:6px">📝 ${esc(o.note)}</div>` : ''}</div>
    <div class="ticket-foot"><span class="muted" style="font-size:13px">${new Date(o.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</span>
      <b class="mono" style="margin-left:auto">฿${money(o.total)}</b></div>
  </div>`;
    }

    /* =========================================================
       STAFF LOGIN (remember me)
       ========================================================= */
    function renderLogin() {
      app().innerHTML = `
  <div class="screen active home" style="justify-content:center">
    <div class="card" style="max-width:400px;margin:0 auto;padding:28px 24px;width:100%">
      <div class="brandmark" style="margin-bottom:22px"><span class="dot">ค</span><b>${esc(DB.settings.name)}</b></div>
      <div class="eyebrow">สำหรับพนักงาน</div>
      <h1 style="font-size:26px;margin:6px 0 20px">เข้าสู่ระบบ</h1>
      <label class="f">ชื่อผู้ใช้</label>
      <input class="inp" id="luser" placeholder="admin" autocapitalize="off" autocomplete="username">
      <label class="f" style="margin-top:14px">รหัสผ่าน</label>
      <input class="inp" id="lpass" type="password" placeholder="••••" autocomplete="current-password">
      <label style="display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer;font-size:14px;font-weight:500">
        <input type="checkbox" id="lremember" checked style="width:18px;height:18px;accent-color:var(--green)">
        จดจำการเข้าสู่ระบบบนอุปกรณ์นี้
      </label>
      <button class="btn btn-green btn-block" style="margin-top:20px" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="note" style="margin-top:16px">ทดลองใช้: ผู้ใช้ <b>admin</b> · รหัส <b>1234</b> (เปลี่ยนได้ในเมนูตั้งค่า)</div>
      <div class="center" style="margin-top:14px"><button class="link" style="background:none" onclick="S.view='home';render()">← กลับหน้าแรก</button></div>
    </div>
  </div>`;
      setTimeout(() => $('#lpass')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() }), 0);
    }
    async function doLogin() {
      const u = $('#luser').value.trim(), p = $('#lpass').value, rem = $('#lremember').checked;
      const found = DB.staff.find(s => s.user === u && s.pass === p);
      if (!found) { toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); return; }
      S.staffUser = u;
      if (rem) { await dbSet('session', { user: u }, false); }
      else { await sSet('session', '', false); }
      await reloadOrders(); S.view = 'staff'; S.tab = 'orders'; render();
    }
    async function logout() { await sSet('session', '', false); S.staffUser = null; S.view = 'home'; render(); }

    /* =========================================================
       STAFF SHELL
       ========================================================= */
    function activeCount() { return DB.orders.filter(o => o.status !== 'paid' && o.status !== 'cancelled').length; }
    function renderStaff() {
      const me = DB.staff.find(s => s.user === S.staffUser) || { name: S.staffUser };
      const tabs = [
        { k: 'orders', l: 'ออเดอร์', b: activeCount() },
        { k: 'new', l: 'รับออเดอร์' },
        { k: 'menu', l: 'เมนู' },
        { k: 'tables', l: 'โต๊ะ & QR' },
        { k: 'report', l: 'รายงาน · Excel' },
        { k: 'settings', l: 'ตั้งค่า' },
      ];
      app().innerHTML = `
  <div class="screen active">
    <div class="staff-head">
      <span class="sh-dot">ค</span>
      <div><b>${esc(DB.settings.name)}</b><small>เข้าใช้โดย ${esc(me.name || S.staffUser)}</small></div>
      <button class="btn btn-sm" style="margin-left:auto;background:#3a3c31;color:#fff" onclick="logout()">ออกจากระบบ</button>
    </div>
    <div class="tabs">${tabs.map(t => `<button class="tab ${S.tab === t.k ? 'active' : ''}" onclick="S.tab='${t.k}';renderStaff()">${t.l}${t.b ? `<span class="badge">${t.b}</span>` : ''}</button>`).join('')}</div>
    <div class="staff-body" id="staffBody"></div>
  </div>`;
      const b = S.tab;
      if (b === 'orders') renderOrders();
      else if (b === 'new') renderNewOrder();
      else if (b === 'menu') renderMenuEditor();
      else if (b === 'tables') renderTables();
      else if (b === 'report') renderReport();
      else if (b === 'settings') renderSettings();
    }

    /* ---------- ORDERS board ---------- */
    function renderOrders() {
      const body = $('#staffBody'); if (!body) return;
      const filters = [{ k: 'active', l: 'กำลังทำงาน' }, { k: 'new', l: 'ใหม่' }, { k: 'cooking', l: 'กำลังทำ' }, { k: 'served', l: 'เสิร์ฟแล้ว' }, { k: 'paid', l: 'ชำระแล้ว' }, { k: 'all', l: 'ทั้งหมด' }];
      let list = [...DB.orders].sort((a, b) => b.createdAt - a.createdAt);
      if (S.ofilter === 'active') list = list.filter(o => o.status !== 'paid' && o.status !== 'cancelled');

      startPoll();

    function staffTicket(o) {
      const st = STATUSES.find(s => s.key === o.status);
      const nextBtn = st && st.next ? `<button class="btn btn-sm btn-green grow" onclick="advance('${o.id}')">→ ${stLabel(st.next)}</button>` : '';
      return `<div class="ticket">
    <div class="ticket-top"><span class="tk-tb">โต๊ะ ${esc(o.table)}</span><span class="tk-no mono">${esc(o.no || '')}</span>
      <span class="pill st-${o.status}" style="margin-left:auto">${stLabel(o.status)}</span></div>
    <div class="ticket-body">
      ${o.items.map(i => `<div class="ti"><span class="q">${i.qty}×</span><span>${esc(i.name)}</span><span class="mono muted" style="margin-left:auto">฿${money(i.qty * i.price)}</span></div>`).join('')}

      await reloadOrders(); const o = DB.orders.find(x => x.id === id); if (!o) return;

    <div class="note">หมายเหตุ: การซิงก์กับไฟล์ Excel/OneDrive แบบเรียลไทม์สองทางต้องใช้เซิร์ฟเวอร์เชื่อม Microsoft Graph/Google API เมื่อนำแอปไปวางบนโฮสต์จริง — เวอร์ชันนี้รองรับส่งออก/นำเข้าไฟล์ครบถ้วน</div>`;
    }
    function exportExcel() {
      if (!window.XLSX) { toast('กำลังโหลดไลบรารี…'); return; }
      const wb = XLSX.utils.book_new();
      const rows = [];
      DB.orders.forEach(o => {
        o.items.forEach((it, idx) => {
          rows.push({
            'เลขที่ออเดอร์': o.no, 'โต๊ะ': o.table,
            'วันที่': new Date(o.createdAt).toLocaleDateString('th-TH'),
            'เวลา': new Date(o.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
            'เมนู': it.name, 'จำนวน': it.qty, 'ราคา/หน่วย': it.price, 'รวม': it.qty * it.price,
            'สถานะ': stLabel(o.status), 'ผู้รับออเดอร์': o.by || '', 'หมายเหตุ': idx === 0 ? (o.note || '') : ''
          });
        });
      });
      if (!rows.length) rows.push({ 'เลขที่ออเดอร์': '', 'โต๊ะ': '', 'เมนู': 'ยังไม่มีข้อมูล' });
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 8 }, { wch: 22 }, { wch: 8 }, { wch: 10 }, { wch: 8 }, { wch: 12 }, { wch: 16 }, { wch: 18 }];
      XLSX.utils.book_append_sheet(wb, ws, 'ออเดอร์');
      // summary by menu
      const sum = {};
      DB.orders.filter(o => o.status !== 'cancelled').forEach(o => o.items.forEach(it => {
        sum[it.name] = sum[it.name] || { 'เมนู': it.name, 'จำนวนขาย': 0, 'ยอดขาย': 0 };
        sum[it.name]['จำนวนขาย'] += it.qty; sum[it.name]['ยอดขาย'] += it.qty * it.price;
      }));
      const sumRows = Object.values(sum).sort((a, b) => b['ยอดขาย'] - a['ยอดขาย']);
      const ws2 = XLSX.utils.json_to_sheet(sumRows.length ? sumRows : [{ 'เมนู': 'ยังไม่มีข้อมูล' }]);
      ws2['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 12 }];
      XLSX.utils.book_append_sheet(wb, ws2, 'สรุปยอดขาย');
      XLSX.writeFile(wb, `ออเดอร์_${DB.settings.name}_${new Date().toISOString().slice(0, 10)}.xlsx`);
      toast('ดาวน์โหลดไฟล์ Excel แล้ว ✓');
    }
    function downloadTemplate() {
      if (!window.XLSX) { toast('กำลังโหลดไลบรารี…'); return; }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet([
        { 'ชื่อเมนู': 'ผัดกะเพราหมู', 'ราคา': 70, 'หมวดหมู่': 'ผัด', 'ไอคอน': '🍳', 'คำอธิบาย': 'เผ็ดร้อน' },
        { 'ชื่อเมนู': 'ชาเย็น', 'ราคา': 40, 'หมวดหมู่': 'เครื่องดื่ม', 'ไอคอน': '🧋', 'คำอธิบาย': '' },
      ]);
      ws['!cols'] = [{ wch: 20 }, { wch: 8 }, { wch: 14 }, { wch: 8 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, ws, 'เมนู');
      XLSX.writeFile(wb, 'เทมเพลตเมนู.xlsx');
    }
    function importMenu(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const wb = XLSX.read(ev.target.result, { type: 'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws);
          let added = 0;
          rows.forEach(r => {
            const name = (r['ชื่อเมนู'] || r['name'] || '').toString().trim(); if (!name) return;
            DB.menu.push({
              id: uid(), name, price: Number(r['ราคา'] || r['price']) || 0,
              cat: (r['หมวดหมู่'] || r['cat'] || 'อื่น ๆ').toString().trim(),
              emoji: (r['ไอคอน'] || r['emoji'] || '🍴').toString().trim(),
              desc: (r['คำอธิบาย'] || r['desc'] || '').toString().trim(), available: true
            }); added++;
          });
          await saveMenu(); renderReport(); toast(`นำเข้าเมนู ${added} รายการแล้ว ✓`);
        } catch (err) { toast('อ่านไฟล์ไม่สำเร็จ ตรวจรูปแบบไฟล์'); }
      };
      reader.readAsBinaryString(file);
    }

      ${DB.staff.map((s, i) => `<div class="mrow"><div class="mn"><b>${esc(s.name || s.user)}</b><br><small class="mono">ผู้ใช้: ${esc(s.user)}</small></div>
        ${DB.staff.length > 1 ? `<button class="qbtn" style="color:var(--red);border-color:#eecfc9" onclick="delStaff(${i})">×</button>` : ''}</div>`).join('')}
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="addStaff()">+ เพิ่มพนักงาน</button>
    </div>`;
    }
    async function saveSetForm() {
      DB.settings.name = $('#setName').value.trim() || 'ร้านอาหาร';
      DB.settings.tables = Math.max(1, Number($('#setTables').value) || 12);
      DB.settings.baseUrl = $('#setUrl').value.trim();
      await saveSettings(); renderStaff(); toast('บันทึกการตั้งค่าแล้ว');
    }
    function addStaff() {
      openModal(`<h2 style="font-size:18px;margin-bottom:14px">เพิ่มพนักงาน</h2>
    <label class="f">ชื่อที่แสดง</label><input class="inp" id="stName" placeholder="เช่น น้องแนน">
    <label class="f" style="margin-top:12px">ชื่อผู้ใช้</label><input class="inp" id="stUser" autocapitalize="off">
    <label class="f" style="margin-top:12px">รหัสผ่าน</label><input class="inp" id="stPass">
    <div class="row" style="margin-top:18px"><button class="btn btn-ghost grow" onclick="closeOverlay()">ยกเลิก</button>
      <button class="btn btn-green grow" onclick="saveStaff()">เพิ่ม</button></div>`);
    }
    async function saveStaff() {
      const name = $('#stName').value.trim(), user = $('#stUser').value.trim(), pass = $('#stPass').value;
      if (!user || !pass) { toast('กรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
      if (DB.staff.find(s => s.user === user)) { toast('มีชื่อผู้ใช้นี้แล้ว'); return; }
      DB.staff.push({ user, pass, name: name || user }); await dbSet('staff', DB.staff); closeOverlay(); renderSettings(); toast('เพิ่มพนักงานแล้ว');
    }
    async function delStaff(i) { DB.staff.splice(i, 1); await dbSet('staff', DB.staff); renderSettings(); toast('ลบพนักงานแล้ว'); }

    /* ---------- go ---------- */
    boot();
  </script>
</body>

</html>
